<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOWER — Stegra Boden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E3E9ED; --surface:#FFFFFF; --surface-2:#F4F7F9; --surface-3:#EAEFF3;
  --ink:#0E1A24; --ink-2:#3C4E5C; --ink-3:#6C7D8A;
  --rule:#C9D5DD; --rule-2:#DEE6EB;
  --amber:#C97E12; --amber-bg:#FBEFD9;
  --red:#B32639; --red-bg:#F8DEE2;
  --go:#1B6E5D; --go-bg:#DCEDE8;
  --sea:#245C87; --sea-bg:#DCE8F1;
  --plan:#6C7D8A; --plan-bg:#E6ECF0;
  --focus:#1D6FB8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#080F15; --surface:#101C25; --surface-2:#16242F; --surface-3:#1D2E3A;
    --ink:#DCE7EE; --ink-2:#A4B6C2; --ink-3:#748896;
    --rule:#263A48; --rule-2:#1C2B36;
    --amber:#E5A544; --amber-bg:#3A2C12;
    --red:#E8687C; --red-bg:#3B1720;
    --go:#4FB79E; --go-bg:#0F2B27;
    --sea:#6BA8D6; --sea-bg:#12283A;
    --plan:#7E93A1; --plan-bg:#1A272F;
    --focus:#5AA6E8;
  }
}
:root[data-theme="dark"]{
  --page:#080F15; --surface:#101C25; --surface-2:#16242F; --surface-3:#1D2E3A;
  --ink:#DCE7EE; --ink-2:#A4B6C2; --ink-3:#748896;
  --rule:#263A48; --rule-2:#1C2B36;
  --amber:#E5A544; --amber-bg:#3A2C12;
  --red:#E8687C; --red-bg:#3B1720;
  --go:#4FB79E; --go-bg:#0F2B27;
  --sea:#6BA8D6; --sea-bg:#12283A;
  --plan:#7E93A1; --plan-bg:#1A272F;
  --focus:#5AA6E8;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:"Barlow","Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.cond{font-family:"Barlow Condensed","Barlow",Arial,sans-serif;letter-spacing:.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%;min-height:0}
.topbar{
  display:flex;align-items:center;gap:18px;padding:0 14px;height:52px;
  background:var(--surface);border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-family:"Barlow Condensed";font-weight:700;font-size:23px;letter-spacing:.06em}
.brand span{color:var(--ink-3);font-size:13px;white-space:nowrap}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--surface-2)}
.seg button{padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.roleswitch{display:flex;align-items:center;gap:8px}
.roleswitch>span{font-size:12px;color:var(--ink-3)}
.clock{font-family:"Barlow Condensed";font-size:14px;color:var(--ink-2);white-space:nowrap}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:2px;background:var(--surface-2);font-size:14px}

/* ---------- corridor spine ---------- */
.corridor{
  background:var(--surface);border-bottom:1px solid var(--rule);
  padding:9px 14px 11px;overflow-x:auto;
}
.corridor-inner{display:flex;align-items:stretch;min-width:940px}
.stage{
  flex:1;position:relative;text-align:left;padding:2px 10px 2px 12px;
  border-left:1px solid var(--rule-2);
}
.stage:first-child{border-left:0;padding-left:2px}
.stage .n{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;color:var(--ink)}
.stage .n.zero{color:var(--ink-3);font-weight:500}
.stage .l{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .bar{height:3px;margin-top:6px;background:var(--rule-2)}
.stage .bar i{display:block;height:3px;background:var(--sea)}
.stage[aria-pressed="true"]{background:var(--surface-3)}
.stage[aria-pressed="true"] .l{color:var(--ink)}
.stage.sea .bar i{background:var(--sea)}
.stage.site .bar i{background:var(--go)}
.stage.pre .bar i{background:var(--plan)}

/* ---------- body ---------- */
.body{display:grid;grid-template-columns:186px 1fr;min-height:0}
nav{background:var(--surface);border-right:1px solid var(--rule);padding:10px 0;overflow-y:auto}
nav button{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 14px;
  font-size:14px;color:var(--ink-2);text-align:left;border-left:3px solid transparent;
}
nav button:hover{background:var(--surface-2)}
nav button[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:600;border-left-color:var(--amber)}
nav .glyph{width:17px;text-align:center;font-size:14px;opacity:.85}
nav .count{margin-left:auto;font-size:11.5px;font-weight:600;padding:0 5px;border-radius:2px;background:var(--rule-2);color:var(--ink-2)}
nav .count.hot{background:var(--red-bg);color:var(--red)}
nav .sep{height:1px;background:var(--rule-2);margin:9px 14px}
main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);margin:12px}
.panel-hd{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
.panel-hd h2{margin:0;font-family:"Barlow Condensed";font-size:17px;font-weight:600;letter-spacing:.02em}
.panel-hd .sub{font-size:12px;color:var(--ink-3)}
.panel-bd{padding:13px}
.panel-bd.flush{padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.body{grid-template-columns:56px 1fr}nav button span.lbl{display:none}nav .count{display:none}}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule-2)}
.kpi{padding:11px 13px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
.kpi:nth-child(3n){border-right:0}
.kpi .k{font-size:11.5px;color:var(--ink-3)}
.kpi .v{font-family:"Barlow Condensed";font-size:29px;font-weight:700;line-height:1.05;margin-top:1px}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.kpi .v.alert{color:var(--red)}
.kpi .v.warn{color:var(--amber)}
.kpi .v.good{color:var(--go)}

/* ---------- exception queue ---------- */
.exq{list-style:none;margin:0;padding:0}
.exq li{display:flex;gap:10px;padding:9px 13px 9px 10px;border-bottom:1px solid var(--rule-2);cursor:pointer;align-items:flex-start}
.exq li:hover{background:var(--surface-2)}
.exq .gut{width:3px;align-self:stretch;flex:0 0 3px;background:var(--plan)}
.exq li[data-sev="CRITICAL"] .gut,.exq li[data-sev="HIGH"] .gut{background:var(--red)}
.exq li[data-sev="MEDIUM"] .gut{background:var(--amber)}
.exq .txt{flex:1;min-width:0}
.exq .t{font-weight:500;line-height:1.3}
.exq .m{font-size:12px;color:var(--ink-3);margin-top:2px}
.exq .age{font-family:"Barlow Condensed";font-size:13px;color:var(--ink-3);white-space:nowrap;padding-top:1px}
.code{font-family:"Barlow Condensed";font-weight:600;letter-spacing:.03em}

/* ---------- table ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;font-size:13.2px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);
  font-family:"Barlow Condensed";font-weight:600;font-size:13px;color:var(--ink-2);
  text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;
}
thead th.num,td.num{text-align:right}
thead th .ar{color:var(--ink-3);font-size:10px}
tbody td{padding:6px 9px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.hl{background:var(--amber-bg)}
tbody tr.done td{color:var(--ink-3)}
.money{font-weight:600}
.money.neg{color:var(--red)}
.pill{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11.5px;font-weight:600;font-family:"Barlow Condensed";letter-spacing:.02em}
.p-plan{background:var(--plan-bg);color:var(--ink-2)}
.p-go{background:var(--go-bg);color:var(--go)}
.p-sea{background:var(--sea-bg);color:var(--sea)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-red{background:var(--red-bg);color:var(--red)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.flagrow{display:flex;gap:3px}
.flag{width:16px;height:16px;display:grid;place-items:center;font-size:10px;border-radius:2px;background:var(--rule-2);color:var(--ink-3)}
.flag.ok{background:var(--go-bg);color:var(--go)}
.flag.miss{background:var(--red-bg);color:var(--red)}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 13px;border-bottom:1px solid var(--rule-2);background:var(--surface-2)}
.filters input,.filters select{
  font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--rule);border-radius:2px;
  background:var(--surface);color:var(--ink);
}
.filters input{min-width:180px}
.chipbtn{padding:4px 9px;border:1px solid var(--rule);border-radius:2px;font-size:12.5px;background:var(--surface);color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- map ---------- */
.mapsplit{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:0}
@media (max-width:1000px){.mapsplit{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--surface-3);border-right:1px solid var(--rule);min-height:520px}
.mapbox svg{display:block;width:100%;height:100%}
.maplayers{position:absolute;top:9px;left:9px;background:var(--surface);border:1px solid var(--rule);padding:7px 9px;font-size:12.5px;max-width:190px}
.maplayers label{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer}
.mapkey{position:absolute;bottom:9px;left:9px;background:var(--surface);border:1px solid var(--rule);padding:7px 9px;font-size:12px;display:flex;gap:11px;flex-wrap:wrap;max-width:min(480px,calc(100% - 18px))}
.mapkey i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.veh{cursor:pointer}
.veh:hover circle.hit{stroke-opacity:.5}
.mlist{overflow-y:auto;max-height:calc(100vh - 210px)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,20,.45);z-index:40}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:41;
  background:var(--surface);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer-hd{padding:12px 15px;border-bottom:1px solid var(--rule)}
.drawer-hd .r1{display:flex;align-items:center;gap:10px}
.drawer-hd h3{margin:0;font-family:"Barlow Condensed";font-size:25px;font-weight:700;letter-spacing:.03em}
.drawer-hd .meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.dtabs{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.dtabs button{padding:8px 13px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent}
.dtabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--amber);background:var(--surface)}
.dbody{flex:1;overflow-y:auto;padding:13px 15px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:13.2px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.hr{height:1px;background:var(--rule-2);margin:13px 0}
h4.sec{margin:0 0 8px;font-family:"Barlow Condensed";font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--rule)}
.tl li{position:relative;padding:0 0 13px 20px}
.tl .mk{position:absolute;left:1px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--sea);border:2px solid var(--surface)}
.tl li.future .mk{background:var(--rule)}
.tl li.future .w{color:var(--ink-3)}
.tl .w{font-weight:500;font-size:13.2px}
.tl .ts{font-size:12px;color:var(--ink-3)}

/* money block */
.mrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.mrow.total{font-weight:700;border-bottom:0;border-top:1px solid var(--rule);margin-top:3px;padding-top:7px}
.mrow .lbl{color:var(--ink-2)}
.locked{padding:11px;background:var(--surface-2);border:1px dashed var(--rule);color:var(--ink-3);font-size:13px}

/* chat */
.msg{padding:8px 10px;background:var(--surface-2);border-left:2px solid var(--rule);margin-bottom:8px}
.msg.me{border-left-color:var(--amber)}
.msg .who{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.chatbar{display:flex;gap:7px;margin-top:10px}
.chatbar input{flex:1;font:inherit;padding:6px 9px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink)}
.btn{padding:6px 13px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:2px;font-weight:600;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}

/* misc */
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--ink-3);padding:9px 13px;background:var(--surface-2);border-top:1px solid var(--rule-2)}
.wf{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;border-bottom:1px solid var(--rule-2)}
.wf .sw{width:32px;height:18px;border-radius:9px;background:var(--rule);position:relative;flex:0 0 32px;margin-top:3px;cursor:pointer}
.wf .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.wf .sw[aria-pressed="true"]{background:var(--go)}
.wf .sw[aria-pressed="true"]::after{left:16px}
.wf .rule{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.wf .rule b{color:var(--ink-2);font-weight:600}
.legendline{display:flex;gap:14px;font-size:12px;color:var(--ink-3);padding:7px 13px;flex-wrap:wrap}
.banner{display:flex;gap:10px;padding:10px 13px;background:var(--amber-bg);border-left:3px solid var(--amber);font-size:13px;margin:12px 12px 0}
.banner.red{background:var(--red-bg);border-left-color:var(--red)}
.banner b{font-weight:600}
.mono{font-family:"Barlow Condensed";font-weight:600}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function rateFor(t){
  const c = RATE_MATRIX.find(r => t.L<=r.lmax && t.W<=r.wmax);
  return c || RATE_MATRIX[3];
}

/* deterministyczny PRNG — makieta ma wyglądać tak samo przy każdym otwarciu */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(20260922);

function dstr(d){const p=n=>String(n).padStart(2,'0');return `${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)}.${d.getUTCFullYear()}`;}
function tstr(d){const p=n=>String(n).padStart(2,'0');return `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;}
function addDays(d,n){const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x;}

const LOADS = (function build(){
  const mix = [["SG",16],["T",10],["K",8],["R",7],["P",5],["D",4]];
  const codes=[]; mix.forEach(([k,n])=>{for(let i=1;i<=n;i++)codes.push(`${k}-${String(i).padStart(2,'0')}`);});
  // przeplot, żeby typy nie szły blokami
  const order=[]; let i=0;
  while(order.length<codes.length){ mix.forEach(([k])=>{ const c=codes.find(c=>c.startsWith(k+"-")&&!order.includes(c)); if(c)order.push(c); }); i++; if(i>60)break; }
  codes.forEach(c=>{if(!order.includes(c))order.push(c);});

  const start = new Date('2026-09-08T00:00:00Z');
  return order.map((code,idx)=>{
    const tk = code.split("-")[0], t = TYPES[tk];
    const status = STATUS_PLAN[idx] || "PLANNED";
    const loadDate = addDays(start, Math.floor(idx*1.18));
    const transit = 5 + (rnd()<.25?1:0);
    const delivDate = addDays(loadDate, transit);
    const qty = t.q + (rnd()<.3 ? (rnd()<.5?-1:1) : 0);
    const weight = +(qty*t.u).toFixed(2);
    const r = rateFor(t);
    const escort = t.L>20 ? 2 : (t.L>16.5?1:0);
    const extrasCost = escort? (escort===2?3550:1450) : 0;
    const extrasRev  = escort? (escort===2?4600:1900) : 0;
    const baseCost=r.cost, baseRev=r.rev;
    const bafC=Math.round(baseCost*BAF.pct), bafR=Math.round(baseRev*BAF.pct);
    const totCost=baseCost+bafC+extrasCost, totRev=baseRev+bafR+extrasRev;
    const done = status==="DELIVERED";
    const late = [7,19,26,33].includes(idx);
    const delayMin = late ? [185,340,95,510][[7,19,26,33].indexOf(idx)] : 0;
    const lp = LOADPOINTS[idx%3];
    const di = idx % DRIVERS.length;
    const hasRes = !["PLANNED","RESOURCES_PENDING"].includes(status);
    const permit = !["PLANNED","RESOURCES_PENDING","DOCS_PENDING"].includes(status);
    const pod = ["DELIVERED","UNLOADED"].includes(status);
    const cmr = PROGRESS_OF[status]!==undefined && PROGRESS_OF[status]>=.03;
    const prog = PROGRESS_OF[status] ?? 0;
    const eta = addDays(delivDate, late?1:0);
    eta.setUTCHours(7 + (idx%5), (idx*13)%60);
    const del = addDays(delivDate,0); del.setUTCHours(7+(idx%5), (idx*7)%60);
    const lod = new Date(loadDate); lod.setUTCHours(6+(idx%4), (idx*11)%60);
    return {
      id:idx, code, type:tk, typeName:t.name,
      L:t.L, W:t.W, H:t.H, qty, weight, unit:t.u,
      status, stage:STAGE_OF[status], progress:prog,
      orderNo:`HHL/2026/${String(1240+idx)}`,
      assemblySeq: idx<14 ? idx+1 : (idx + (rnd()<.12 ? 3 : 0) + 1),
      loadPoint:lp,
      planLoad:lod, planDeliv:del, eta,
      delayMin, delayCode: late ? ["D_FERRY","B_CARRIER","E_FORCE","A_CLIENT"][[7,19,26,33].indexOf(idx)] : null,
      driver: hasRes?DRIVERS[di][0]:null, phone: hasRes?DRIVERS[di][1]:null,
      tractor: hasRes?TRACTORS[di]:null, trailer: hasRes?TRAILERS[di]:null,
      ferry: idx%2? "M/F Nova Star":"M/F Wawel",
      ferryRef: hasRes? `PF-${262000+idx*7}` : null,
      comboLen:+(t.L+1.9).toFixed(2), comboW:t.W, comboH:+(t.H+1.15).toFixed(2),
      escort,
      docs:{permit, cmr:cmr&&!!hasRes, pod, lash: cmr&&!!hasRes, ins:true},
      price:{baseCost,bafC,extrasCost,totCost,baseRev,bafR,extrasRev,totRev,
             margin:totRev-totCost, marginPct:(totRev-totCost)/totRev},
      done
    };
  });
})();

const MH = Math.round(MB.W * ((MY1-MY0)/((MB.lon1-MB.lon0)*Math.PI/180)) * MB.squash);
const px = (lon,lat)=>[
  (lon-MB.lon0)/(MB.lon1-MB.lon0)*MB.W,
  (MY1-mercY(lat))/(MY1-MY0)*MH
];
const kmPx = (lat,km)=>{ const a=px(0,lat)[1], b=px(0,lat+km/111)[1]; return Math.abs(a-b); };
const path = pts => pts.map((p,i)=>{const[x,y]=px(p[0],p[1]);return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");

function vehiclePoint(l){
  const p = l.progress;
  if(p<=0) return px(l.loadPoint.lon, l.loadPoint.lat);
  if(p<0.14){ const f=p/0.14;
    return px(l.loadPoint.lon+(PORT_GDA.lon-l.loadPoint.lon)*f, l.loadPoint.lat+(PORT_GDA.lat-l.loadPoint.lat)*f); }
  if(p<0.20) return px(PORT_GDA.lon, PORT_GDA.lat);
  if(p<0.42){ return along(FERRY_PATH,(p-0.20)/0.22); }
  if(p<0.46) return px(PORT_NYN.lon, PORT_NYN.lat);
  return along(SE_ROAD,(p-0.46)/0.54);
}
function along(pts,f){
  f=Math.max(0,Math.min(1,f));
  const segs=[]; let total=0;
  for(let i=1;i<pts.length;i++){
    const a=px(pts[i-1][0],pts[i-1][1]), b=px(pts[i][0],pts[i][1]);
    const d=Math.hypot(b[0]-a[0],b[1]-a[1]); segs.push({a,b,d}); total+=d;
  }
  let want=total*f;
  for(const s of segs){ if(want<=s.d){const t=s.d?want/s.d:0;return [s.a[0]+(s.b[0]-s.a[0])*t, s.a[1]+(s.b[1]-s.a[1])*t];} want-=s.d; }
  const last=segs[segs.length-1]; return last.b;
}

function tableHTML(){
  const L = visibleLoads();
  const cols = [
    ["code",T("c_code"),""],["type",T("c_type"),""],["dims",T("c_dims"),""],
    ["weight",T("c_weight"),"num"],["planLoad",T("c_load"),""],["planDeliv",T("c_deliv"),""],
    ["status",T("c_status"),""],["driver",T("c_driver"),""],["tractor",T("c_plate"),""],
    ["eta",T("c_eta"),""],["docs",T("c_docs"),""]
  ];
  if(seeCost()) cols.push(["cost", S.role==="SCX"?T("c_myprice"):T("c_cost"),"num"]);
  if(seeRev())  cols.push(["rev",  S.role==="KSH"?T("c_yourprice"):T("c_rev"),"num"]);
  if(seeMargin())cols.push(["price",T("c_margin"),"num"]);

  const head = cols.map(([k,l,c])=>`<th class="${c}" data-sort="${k}">${l}${S.sort.k===k?` <span class="ar">${S.sort.dir>0?"▲":"▼"}</span>`:""}</th>`).join("");
  const rows = L.map(l=>{
    const d=l.docs;
    const flags = `<span class="flagrow">
      <span class="flag ${d.permit?'ok':'miss'}" title="Zezwolenie">Z</span>
      <span class="flag ${d.cmr?'ok':''}" title="CMR">C</span>
      <span class="flag ${d.pod?'ok':''}" title="POD">P</span>
      <span class="flag ${d.lash?'ok':''}" title="Mocowanie">M</span></span>`;
    let cells = `
      <td><span class="code">${l.code}</span></td>
      <td>${loc(l.typeName)}</td>
      <td>${l.L.toFixed(2).replace('.',',')} × ${l.W.toFixed(2).replace('.',',')} × ${l.H.toFixed(2).replace('.',',')}</td>
      <td class="num">${l.weight.toFixed(2).replace('.',',')} t</td>
      <td>${dstr(l.planLoad)} ${tstr(l.planLoad)}</td>
      <td>${dstr(l.planDeliv)} ${tstr(l.planDeliv)}</td>
      <td><span class="pill ${STATUS_CLASS[l.status]}">${T("s_"+l.status)}</span>${l.delayMin?` <span class="pill p-red">+${Math.floor(l.delayMin/60)}h${String(l.delayMin%60).padStart(2,'0')}</span>`:""}</td>
      <td>${l.driver?esc(l.driver):`<span style="color:var(--red)">— brak —</span>`}</td>
      <td>${l.tractor?`<span class="mono">${l.tractor}</span>`:"—"}</td>
      <td>${dstr(l.eta)} ${tstr(l.eta)}</td>
      <td>${flags}</td>`;
    if(seeCost()) cells += `<td class="num money">${fmt(l.price.totCost)}</td>`;
    if(seeRev())  cells += `<td class="num money">${fmt(l.price.totRev)}</td>`;
    if(seeMargin())cells+= `<td class="num money ${l.price.marginPct<0.18?'neg':''}">${fmt(l.price.margin)} <span style="font-weight:400;color:var(--ink-3)">${pct(l.price.marginPct)}</span></td>`;
    return `<tr data-load="${l.id}" class="${l.done?'done':''} ${S.hover===l.id?'hl':''}">${cells}</tr>`;
  }).join("");

  return `<div class="filters">
    <input id="q" type="search" placeholder="${T("search")}" value="${esc(S.search)}">
    ${[["all",T("b_all")],["active",T("b_active")],["late",T("b_late")],["nodocs",T("b_nodocs")]]
      .map(([k,l])=>`<button class="chipbtn" data-quick="${k}" aria-pressed="${S.quick===k}">${l}</button>`).join("")}
    <div class="spacer"></div>
    <span style="font-size:12.5px;color:var(--ink-3)">${L.length} / ${LOADS.length}${S.stageFilter?` · ${T("st_"+S.stageFilter)}`:""}</span>
  </div>
  <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  ${seeMargin()?`<div class="note">Kwoty w PLN, po przeliczeniu kursem NBP tabela A z dnia poprzedzającego wykonanie usługi. Marża poniżej 18% jest oznaczona na czerwono.</div>`
   :`<div class="note">${S.role==="KSH"?"Widzisz swoją cenę. Stawki przewoźnika i marża spedytora nie są dostępne w tej roli — ograniczenie działa na poziomie bazy danych, nie interfejsu."
   :"Widzisz swoją stawkę. Cena płacona przez klienta i marża spedytora nie są dostępne w tej roli — ograniczenie działa na poziomie bazy danych, nie interfejsu."}</div>`}`;
}

      <div><h4 class="sec">Od przychodu do marży</h4>
        <div class="mrow"><span class="lbl">Przychód od KSH — stawka bazowa</span><span>${fmt(baseR)} PLN</span></div>
        <div class="mrow"><span class="lbl">Przychód — dodatek paliwowy</span><span>${fmt(bafR)} PLN</span></div>
        <div class="mrow"><span class="lbl">Przychód — pilotaż i dodatki</span><span>${fmt(exR)} PLN</span></div>
        <div class="mrow"><span class="lbl">Koszt Scandinavian Express</span><span style="color:var(--red)">− ${fmt(cost)} PLN</span></div>
        <div class="mrow total"><span>Marża</span><span style="color:var(--go)">${fmt(rev-cost)} PLN · ${pct((rev-cost)/rev)}</span></div>
      </div>
      <div><h4 class="sec">Dodatek paliwowy</h4>${bafCard}</div>
    </div>
    <div class="hr"></div>
    <h4 class="sec">Marża według typu elementu</h4>
    <table style="width:100%;font-size:13px"><thead><tr>
      <th style="text-align:left">Typ</th><th class="num">Szt.</th><th class="num">Przychód</th>
      <th class="num">Koszt</th><th class="num">Marża</th><th style="width:140px"></th></tr></thead>
      <tbody>${byType.map(t=>`<tr>
        <td><span class="code">${t.k}</span> ${loc(TYPES[t.k].name)}</td>
        <td class="num">${t.n}</td><td class="num">${fmt(t.r)}</td><td class="num">${fmt(t.c)}</td>
        <td class="num money ${t.p<0.18?'neg':''}">${fmt(t.m)} · ${pct(t.p)}</td>
        <td><svg width="130" height="12"><rect width="${(t.r/maxAbs*130).toFixed(0)}" height="12" fill="var(--rule)"/>
          <rect width="${(t.c/maxAbs*130).toFixed(0)}" height="12" fill="var(--sea)" fill-opacity=".55"/></svg></td>
      </tr>`).join("")}</tbody></table>
    <div class="note" style="margin:11px -13px -13px">Transport, który nie trafia w żaden przedział cennika, nie dostaje stawki zero — trafia na listę wyjątków. Cicha zerowa stawka to najprostszy sposób na fikcyjną marżę.</div>
    </div></div>`;
}

function viewInv(){
  const week = LOADS.filter(l=>l.done).slice(-6);
  const expected = week.reduce((s,l)=>s+l.price.totCost,0);
  const invoiced = expected + 1840;
  const rows = week.map((l,i)=>{
    const inv = l.price.totCost + (i===2?1240:i===4?600:0);
    const diff = inv-l.price.totCost;
    return `<tr><td><span class="code">${l.code}</span></td><td>${loc(l.typeName)}</td>
      <td>${dstr(l.planDeliv)}</td>
      <td class="num">${fmt(l.price.totCost)}</td><td class="num">${fmt(inv)}</td>
      <td class="num ${diff?'money neg':''}">${diff?`+${fmt(diff)}`:"—"}</td>
      <td>${diff?`<span class="pill p-red">poza cennikiem</span>`:`<span class="pill p-go">zgodna</span>`}</td></tr>`;
  }).join("");
  return `<div class="panel" style="margin:12px"><div class="panel-hd">
    <h2>${T("nav_inv")}</h2><span class="sub">tydzień 38 · 14–20.09.2026 · Scandinavian Express</span>
    <div class="spacer"></div>
    ${S.role==="SCX"?`<button class="btn">Złóż fakturę</button>`:`<button class="chipbtn">Zgłoś spór</button><button class="btn">Zatwierdź</button>`}</div>
    <div class="panel-bd flush">
      <div class="filters"><span>Kwota z cennika <b class="mono">${fmt(expected)} PLN</b></span>
        <span>Kwota z faktury <b class="mono">${fmt(invoiced)} PLN</b></span>
        <span>Rozbieżność <b class="mono" style="color:var(--red)">+${fmt(invoiced-expected)} PLN</b></span>
        <div class="spacer"></div><span class="pill p-red">Do wyjaśnienia</span></div>
      <div class="tablewrap"><table><thead><tr><th>Wysyłka</th><th>Typ</th><th>Dostawa</th>
        <th class="num">Wg cennika</th><th class="num">Zafakturowano</th><th class="num">Różnica</th><th>Ocena</th>
        </tr></thead><tbody>${rows}</tbody></table></div>
      <div class="note">Porównanie trójstronne: transporty zaznaczone przez przewoźnika ↔ transporty faktycznie zrealizowane ↔ kwota wynikająca z cennika. Dwie pozycje rozliczone poza macierzą — pilotaż drugiego pojazdu nie był awizowany.</div>
    </div></div>`;
}

function viewWf(){
  return `<div class="panel" style="margin:12px"><div class="panel-hd"><h2>${T("nav_wf")}</h2>
    <span class="sub">${WORKFLOWS.filter(w=>w.on).length} aktywnych</span><div class="spacer"></div>
    <button class="chipbtn">Nowa reguła</button></div>
    <div class="panel-bd flush">
    ${WORKFLOWS.map((w,i)=>`<div class="wf">
      <span class="sw" data-wf="${i}" aria-pressed="${w.on}" role="button" tabindex="0" aria-label="Włącz lub wyłącz"></span>
      <span style="flex:1"><span style="font-weight:600">${loc(w.name)}</span>
        <span class="rule">${loc(w.rule)}</span></span>
      <span style="text-align:right;white-space:nowrap;color:var(--ink-3);font-size:12.5px">${w.runs}× w tym miesiącu</span>
    </div>`).join("")}
    <div class="note">Reguła to wyzwalacz, warunek i lista akcji. Bez płótna do rysowania — formularz w trzech polach buduje się w minutę, a płótno to osobny projekt na tygodnie.</div>
    </div></div>`;
}

function viewTasks(){
  const need = LOADS.filter(l=>["RESOURCES_PENDING","DOCS_PENDING","READY"].includes(l.status)).slice(0,9);
  return `<div class="panel" style="margin:12px"><div class="panel-hd"><h2>${T("nav_tasks")}</h2>
    <span class="sub">uzupełnij przed terminem — po nim wychodzi eskalacja</span></div>
    <div class="panel-bd flush"><div class="tablewrap"><table>
      <thead><tr><th>Wysyłka</th><th>Czego brakuje</th><th>Załadunek</th><th>Termin</th><th>Stan</th><th></th></tr></thead>
      <tbody>${need.map((l,i)=>{
        const what = l.status==="RESOURCES_PENDING"?"Kierowca, telefon, nr rejestracyjne"
          : l.status==="DOCS_PENDING"?"Zezwolenie PL i dispens SE" : "Awizacja godziny podjęcia";
        const hrs = 18+i*9;
        return `<tr data-load="${l.id}"><td><span class="code">${l.code}</span></td>
          <td>${what}</td><td>${dstr(l.planLoad)} ${tstr(l.planLoad)}</td>
          <td class="mono">za ${hrs} h</td>
          <td><span class="pill ${hrs<24?"p-red":hrs<48?"p-amber":"p-plan"}">${hrs<24?"pilne":hrs<48?"wkrótce":"w terminie"}</span></td>
          <td style="text-align:right"><button class="chipbtn">Uzupełnij</button></td></tr>`;}).join("")}
      </tbody></table></div></div></div>`;
}

/* ---------- 7. Szuflada transportu ---------- */
function drawerHTML(l){
  const tabs=[["over",T("d_over")],["tl",T("d_tl")],["docs",T("d_docs")],["money",T("d_money")],["chat",T("d_chat")]];
  let body="";
  if(S.dtab==="over"){
    body = `<dl class="kv">
      <dt>${T("c_type")}</dt><dd>${loc(l.typeName)} · ${l.qty} szt.</dd>
      <dt>${T("c_dims")}</dt><dd>${l.L.toFixed(2).replace('.',',')} × ${l.W.toFixed(2).replace('.',',')} × ${l.H.toFixed(2).replace('.',',')} m</dd>
      <dt>Wymiary zestawu</dt><dd>${l.comboLen.toFixed(2).replace('.',',')} × ${l.comboW.toFixed(2).replace('.',',')} × ${l.comboH.toFixed(2).replace('.',',')} m</dd>
      <dt>${T("c_weight")}</dt><dd>${l.weight.toFixed(2).replace('.',',')} t (${l.qty} × ${l.unit.toFixed(2).replace('.',',')} t)</dd>
      <dt>${T("c_order")}</dt><dd>${l.orderNo}</dd>
      <dt>${T("c_seq")}</dt><dd>pozycja ${l.assemblySeq}</dd>
      <dt>Miejsce załadunku</dt><dd>${l.loadPoint.n}</dd>
      <dt>${T("c_load")}</dt><dd>${dstr(l.planLoad)} · okno ${tstr(l.planLoad)}–${tstr(addDays(l.planLoad,0))}</dd>
      <dt>${T("c_deliv")}</dt><dd>${dstr(l.planDeliv)} ${tstr(l.planDeliv)}</dd>
      <dt>${T("c_eta")}</dt><dd>${dstr(l.eta)} ${tstr(l.eta)} ${l.delayMin?`<span class="pill p-red">+${Math.floor(l.delayMin/60)} h ${l.delayMin%60} min</span>`:`<span class="pill p-go">w oknie</span>`}</dd>
      ${l.delayCode?`<dt>Kod przyczyny</dt><dd><span class="pill p-amber">${l.delayCode}</span></dd>`:""}
      <dt>Kierowca</dt><dd>${l.driver?`${esc(l.driver)} · ${l.phone}`:'<span style="color:var(--red)">nie uzupełniono</span>'}</dd>
      <dt>Ciągnik / naczepa</dt><dd>${l.tractor?`<span class="mono">${l.tractor}</span> / <span class="mono">${l.trailer}</span>`:"—"}</dd>
      <dt>Pilotaż</dt><dd>${l.escort?`${l.escort} pojazd${l.escort>1?"y":""}`:"nie wymagany"}</dd>
      <dt>Prom</dt><dd>${l.ferryRef?`${l.ferry} · ${l.ferryRef}`:"brak rezerwacji"}</dd>
    </dl>
    ${!l.docs.permit?`<div class="banner red" style="margin:13px 0 0">
      <b>Brak zezwolenia.</b> Zestaw ma ${l.comboLen.toFixed(2).replace('.',',')} m długości — transport nie może ruszyć bez dokumentu obejmującego ten wymiar.</div>`:
     `<div class="banner" style="margin:13px 0 0;background:var(--go-bg);border-left-color:var(--go)">
      <b>Zezwolenie zgodne.</b> Wymiary zestawu mieszczą się w limitach dokumentu PL/2026/${1400+l.id} ważnego do 30.11.2026.</div>`}`;
  }
  if(S.dtab==="tl"){
    const steps=[
      ["Harmonogram zaimportowany", dstr(addDays(l.planLoad,-9))+" 09:14", true],
      ["Transport przypisany do przewoźnika", dstr(addDays(l.planLoad,-7))+" 11:02", true],
      ["Zasoby uzupełnione", l.driver?dstr(addDays(l.planLoad,-2))+" 15:40":"oczekuje", !!l.driver],
      ["Zezwolenie załączone i zweryfikowane", l.docs.permit?dstr(addDays(l.planLoad,-2))+" 16:05":"oczekuje", l.docs.permit],
      ["Wjazd w strefę załadunku", l.progress>=.03?dstr(l.planLoad)+" "+tstr(l.planLoad):"—", l.progress>=.03],
      ["Wyjazd z załadunku", l.progress>=.09?dstr(l.planLoad)+" 11:22":"—", l.progress>=.09],
      ["Odprawa w terminalu Gdańsk", l.progress>=.16?dstr(addDays(l.planLoad,1))+" 17:50":"—", l.progress>=.16],
      ["Prom odbił od nabrzeża", l.progress>=.30?dstr(addDays(l.planLoad,1))+" 21:10":"—", l.progress>=.30],
      ["Zjazd z promu w Nynäshamn", l.progress>=.43?dstr(addDays(l.planLoad,2))+" 12:35":"—", l.progress>=.43],
      ["Kontrola E4 · Sundsvall", l.progress>=.62?dstr(addDays(l.planLoad,3))+" 08:12":"—", l.progress>=.62],
      ["Kontrola E4 · Luleå", l.progress>=.90?dstr(addDays(l.planLoad,4))+" 06:44":"—", l.progress>=.90],
      ["Wjazd w bufor 50 km · powiadomienie ekipy", l.progress>=.95?dstr(l.planDeliv)+" 07:02":"—", l.progress>=.95],
      ["Przyjazd na plac Stegra", l.progress>=.99?dstr(l.planDeliv)+" "+tstr(l.planDeliv):"—", l.progress>=.99],
      ["Rozładunek zakończony", l.done?dstr(l.planDeliv)+" 13:26":"—", l.done],
      ["POD wgrany", l.docs.pod?dstr(l.planDeliv)+" 15:08":"—", l.docs.pod]
    ];
    body = `<ul class="tl">${steps.map(([w,t,ok])=>`<li class="${ok?"":"future"}">
      <span class="mk"></span><div class="w">${w}</div><div class="ts">${t}</div></li>`).join("")}</ul>`;
  }
  if(S.dtab==="docs"){
    const d=[["Zezwolenie PL",l.docs.permit,"PL/2026/"+(1400+l.id)+".pdf"],
             ["Dispens SE",l.docs.permit,"TRV-2026-"+(88100+l.id)+".pdf"],
             ["CMR",l.docs.cmr,"CMR_"+l.code+".pdf"],
             ["Zdjęcia mocowania",l.docs.lash,l.code+"_mocowanie_04.jpg"],
             ["POD",l.docs.pod,"POD_"+l.code+"_podpisany.pdf"],
             ["Polisa OCP",true,"OCP_SCX_2026.pdf"]];
    body = d.map(([n,ok,f])=>`<div class="mrow">
      <span class="lbl">${n}</span>
      <span>${ok?`<span style="color:var(--go)">✓</span> <span style="font-size:12.5px">${f}</span>`
        :`<span style="color:var(--red)">brak</span>`}</span></div>`).join("")
      + `<div style="margin-top:13px"><button class="btn ghost">Pobierz paczkę ZIP</button>
         ${S.role!=="KSH"?`<button class="btn" style="margin-left:7px">Wgraj dokument</button>`:""}</div>`;
  }
  if(S.dtab==="money"){
    const p=l.price;
    const cost = `<h4 class="sec">${S.role==="SCX"?T("c_myprice"):T("c_cost")} — Scandinavian Express</h4>
      <div class="mrow"><span class="lbl">Stawka bazowa (${l.L.toFixed(2).replace('.',',')} m / ${l.weight.toFixed(1).replace('.',',')} t)</span><span>${fmt(p.baseCost)} PLN</span></div>
      <div class="mrow"><span class="lbl">Dodatek paliwowy 12,4%</span><span>${fmt(p.bafC)} PLN</span></div>
      ${p.extrasCost?`<div class="mrow"><span class="lbl">Pilotaż ${l.escort} poj.</span><span>${fmt(p.extrasCost)} PLN</span></div>`:""}
      <div class="mrow total"><span>Razem</span><span>${fmt(p.totCost)} PLN</span></div>`;
    const rev = `<h4 class="sec" style="margin-top:15px">${S.role==="KSH"?T("c_yourprice"):T("c_rev")} — KSH</h4>
      <div class="mrow"><span class="lbl">Stawka bazowa</span><span>${fmt(p.baseRev)} PLN</span></div>
      <div class="mrow"><span class="lbl">Dodatek paliwowy 12,4%</span><span>${fmt(p.bafR)} PLN</span></div>
      ${p.extrasRev?`<div class="mrow"><span class="lbl">Pilotaż ${l.escort} poj.</span><span>${fmt(p.extrasRev)} PLN</span></div>`:""}
      <div class="mrow total"><span>Razem</span><span>${fmt(p.totRev)} PLN</span></div>`;
    const marg = `<div class="mrow total" style="margin-top:15px;border-top:2px solid var(--ink)">
      <span>${T("c_margin")}</span><span style="color:${p.marginPct<0.18?'var(--red)':'var(--go)'}">${fmt(p.margin)} PLN · ${pct(p.marginPct)}</span></div>`;
    body = (seeCost()?cost:`<div class="locked">${T("locked")}</div>`)
         + (seeRev()?rev:`<div class="locked" style="margin-top:13px">${T("locked")}</div>`)
         + (seeMargin()?marg:"");
  }
  if(S.dtab==="chat"){
    body = CHAT.map(m=>`<div class="msg ${m.me?"me":""}">
      <div class="who">${m.who} · ${m.t}</div><div>${esc(loc(m))}</div></div>`).join("")
      + `<div class="chatbar"><input placeholder="${T("msgph")}"><button class="btn">${T("send")}</button></div>`;
  }

  return `<div class="scrim" data-close="1"></div>
  <aside class="drawer" role="dialog" aria-label="${l.code}">
    <div class="drawer-hd">
      <div class="r1">
        <h3>${l.code}</h3>
        <span class="pill ${STATUS_CLASS[l.status]}">${T("s_"+l.status)}</span>
        ${l.delayMin?`<span class="pill p-red">+${Math.floor(l.delayMin/60)} h ${l.delayMin%60} min</span>`:""}
        <div class="spacer"></div>
        <button class="iconbtn" data-close="1" aria-label="Zamknij">✕</button>
      </div>
      <div class="meta">${loc(l.typeName)} · ${l.orderNo} · ${l.loadPoint.n} → Boden</div>
    </div>
    <div class="dtabs">${tabs.map(([k,t])=>`<button data-dtab="${k}" aria-selected="${S.dtab===k}">${t}</button>`).join("")}</div>
    <div class="dbody">${body}</div>
  </aside>`;
}

/* ---------- 8. Render ---------- */
const VIEWS = {dash:viewDash,map:viewMap,sched:viewSched,risk:viewRisk,docs:viewDocs,
               fin:viewFin,inv:viewInv,wf:viewWf,geo:viewGeo,tasks:viewTasks};

function render(){
  document.getElementById('brandSub').innerHTML = ROLE_META[S.role].sub;
  document.getElementById('roleLbl').textContent = T("view");
  document.getElementById('corridor').innerHTML = corridorHTML();
  document.getElementById('nav').innerHTML = navHTML();
  const fn = VIEWS[S.view] || viewDash;
  document.getElementById('main').innerHTML = fn();
  document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  document.querySelectorAll('#langSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  const old=document.querySelector('.scrim'), oldD=document.querySelector('.drawer');
  old&&old.remove(); oldD&&oldD.remove();
  if(S.open!=null){
    const l=LOADS.find(x=>x.id===S.open);
    if(l) document.body.insertAdjacentHTML('beforeend', drawerHTML(l));
  }
}

/* ---------- 9. Zdarzenia ---------- */
document.addEventListener('click', e=>{
  const t = e.target;
  const closest = s => t.closest(s);

  if(closest('[data-close]')){ S.open=null; render(); return; }
  const roleB = closest('#roleSeg button');
  if(roleB){ S.role=roleB.dataset.role;
    if(S.view==="wf"||S.view==="geo"){ if(S.role!=="HHL") S.view="dash"; }
    if(S.view==="tasks" && S.role!=="SCX") S.view="dash";
    if(S.view==="inv" && S.role==="KSH") S.view="fin";
    render(); return; }
  const langB = closest('#langSeg button');
  if(langB){ S.lang=langB.dataset.lang; render(); return; }
  if(closest('#themeBtn')){
    const cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==="dark"?"light":"dark"); return; }

  const stage = closest('.stage');
  if(stage){ const s=stage.dataset.stage; S.stageFilter = S.stageFilter===s?null:s;
    if(S.view==="dash") S.view="sched"; render(); return; }

  const nav = closest('[data-view]');
  if(nav){ S.view=nav.dataset.view; S.open=null; render(); return; }

  const quick = closest('[data-quick]');
  if(quick){ S.quick=quick.dataset.quick; render(); return; }

  const th = closest('th[data-sort]');
  if(th){ const k=th.dataset.sort;
    S.sort = S.sort.k===k ? {k,dir:-S.sort.dir} : {k,dir:1}; render(); return; }

  const layer = closest('[data-layer]');
  if(layer){ S.layers[layer.dataset.layer]=layer.checked; render(); return; }

  const wf = closest('[data-wf]');
  if(wf){ const i=+wf.dataset.wf; WORKFLOWS[i].on=!WORKFLOWS[i].on; render(); return; }

  const dtab = closest('[data-dtab]');
  if(dtab){ S.dtab=dtab.dataset.dtab; render(); return; }

  const risk = closest('[data-risk]');
  if(risk){ const r=RISKS[+risk.dataset.risk];
    if(r.load){ S.open=r.load.id; S.dtab="over"; render(); }
    else { S.view="risk"; render(); } return; }

  const row = closest('[data-load]');
  if(row){ S.open=+row.dataset.load; S.dtab="over"; render(); return; }
});

document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.search=e.target.value;
    const pos=e.target.selectionStart; render();
    const q=document.getElementById('q'); if(q){q.focus(); q.setSelectionRange(pos,pos);} }
});

document.addEventListener('mouseover', e=>{
  const el=e.target.closest('[data-load]');
  const id = el? +el.dataset.load : null;
  if(id!==S.hover && (S.view==="map")){ S.hover=id; render(); }
});

document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&S.open!=null){S.open=null;render();} });

render();
</script>
</body>
</html>
