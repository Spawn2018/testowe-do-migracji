name: db

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'x'
        required: false
        default: ''

jobs:
  db-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 + PostGIS (PGDG), age
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17 postgresql-17-postgis-3 age
          sudo pg_dropcluster --stop 17 main 2>/dev/null || true
          sudo pg_createcluster 17 main --port 5433 --start -- --auth=trust
          psql postgres://postgres@localhost:5433/postgres -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if; end \$\$;"
      - name: Introspekcja
        env:
          TZ: Europe/Warsaw
        run: |
          ADMIN=postgres://postgres@localhost:5433/postgres
          url=postgres://postgres@localhost:5433/tower_boot
          psql $ADMIN -q -c "create database tower_boot"
          psql $url -q -v ON_ERROR_STOP=1 -f tests/db/supabase_stub.sql >/dev/null
          for f in supabase/migrations/*.sql; do
            psql $url -q -v ON_ERROR_STOP=1 -f "$f" >/dev/null 2>/tmp/err || { echo "FAIL $f"; tail -5 /tmp/err; exit 1; }
          done
          psql $url -f tmp-introspect.sql
