name: sms-gateway-apk

on:
  push:
    paths:
      - 'android/sms-gateway/**'
      - '.github/workflows/sms-gateway-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/sms-gateway
    steps:
      # P3-APK — uzupełnienie W21: pin SHA (D-86: token ma uprawnienie workflow)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # pakiet „tools” usunięty z SDK — domyślne „tools platform-tools” pada na runnerze (README akcji: packages)
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          # CI: bez lokalnego D:/Watch Tower/… (spacja psuje URI w file(); klucz poza repo)
          TOWER_APK_KEYSTORE_PROPS: /nonexistent/tower-apk-keystore.properties
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sms-gateway-debug
          path: android/sms-gateway/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
