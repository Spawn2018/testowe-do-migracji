# Automat wdrożenia z main (D-20261019-1050-01 §5, F7 #319).
# Kolejność stała: baza → funkcje Edge zmienione w pushu → produkcja Vercel.
# Gdy krok bazy padnie, Edge i produkcja się nie wykonują.
# Brak sekretów: zielono, ostrzeżenie „brak kluczy — wdrożenie ręczne”.
# Adres bazy (SUPABASE_DB_URL) nigdy nie trafia do logu.

name: deploy-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: baza, Edge, produkcja
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PROJECT_REF: nglnnrmzmhusvxslousq
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Klucze
        id: keys
        run: |
          set -euo pipefail
          set +x
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_URL}" ] || [ -z "${VERCEL_TOKEN}" ]; then
            echo "brak kluczy — wdrożenie ręczne"
            echo "::warning::brak kluczy — wdrożenie ręczne"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.keys.outputs.skip != 'true'
        with:
          version: 2.121.0

      - name: Baza
        if: steps.keys.outputs.skip != 'true'
        env:
          DB_URL_FILE: ${{ runner.temp }}/db-url
          DB_PORT_FILE: ${{ runner.temp }}/db-port
          DB_PASSWORD_FILE: ${{ runner.temp }}/db-password
          DB_MODE_FILE: ${{ runner.temp }}/db-mode
        run: |
          set -euo pipefail
          set +x
          python3 scripts/ci/normalize-db-url.py
          port="$(cat "$DB_PORT_FILE")"
          mode="$(cat "$DB_MODE_FILE")"
          redact() { python3 scripts/ci/redact.py; }
          run_push() {
            local code=0
            local out
            local url
            url="$(cat "$DB_URL_FILE")"
            out="$(supabase db push --db-url="$url" "$@" 2>&1)" || code=$?
            printf '%s\n' "$out" | redact
            if [ "$code" -ne 0 ]; then
              if [ "$port" = "6543" ]; then
                echo "potrzebny adres sesyjny (port 5432)"
              fi
              exit "$code"
            fi
          }
          push_linked() {
            local code=0
            local out
            out="$(supabase db push --linked "$@" 2>&1)" || code=$?
            printf '%s\n' "$out" | redact
            if [ "$code" -ne 0 ]; then
              exit "$code"
            fi
          }
          if [ "$mode" = "pooler" ]; then
            echo "Lista migracji (dry-run, pula w adresie):"
            run_push --dry-run --yes --skip-vault
            run_push --yes --skip-vault
          else
            echo "Polaczenie: supabase link, pula IPv4 z API."
            export SUPABASE_DB_PASSWORD="$(cat "$DB_PASSWORD_FILE")"
            link_code=0
            link_out="$(supabase link --project-ref "$PROJECT_REF" --yes 2>&1)" || link_code=$?
            printf '%s\n' "$link_out" | redact
            if [ "$link_code" -ne 0 ]; then
              exit "$link_code"
            fi
            echo "Lista migracji (dry-run):"
            push_linked --dry-run --yes --skip-vault
            push_linked --yes --skip-vault
          fi

      - name: Edge
        if: steps.keys.outputs.skip != 'true'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          # #441: porównuj z SHA ostatniego *udanego* deploy-main, w którym krok Edge
          # faktycznie się wykonał (nie przebieg z skip=true / brak kluczy). Nie HEAD~1.
          # Gdy push A (Edge) padnie przed krokiem Edge, a push B (docs) użyje before=A,
          # diff B..HEAD nie zawiera plików z A — funkcje nie wrócą na produkcję.
          before=""
          deploy_all=0
          if command -v gh >/dev/null 2>&1; then
            while IFS=$'\t' read -r run_id sha; do
              [ -z "${run_id:-}" ] && continue
              [ "$sha" = "${GITHUB_SHA}" ] && continue
              edge_concl="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq '[.jobs[].steps[]? | select(.name == "Edge") | .conclusion][0] // empty' 2>/dev/null || true)"
              # success = krok Edge się wykonał; skipped = brak kluczy (nie baza porównania)
              if [ "$edge_concl" = "success" ]; then
                before="$sha"
                break
              fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-main.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' 2>/dev/null || true)
          fi
          if [ -n "$before" ]; then
            echo "Edge: baza porównania = ostatni udany deploy z krokiem Edge ($before)"
          else
            before="${PUSH_BEFORE:-}"
            echo "Edge: brak udanego deployu z Edge w API — fallback github.event.before"
          fi
          if [ -z "$before" ] || printf '%s' "$before" | grep -Eq '^0+$'; then
            echo "Brak poprzedniego commita — wdrażam wszystkie funkcje Edge."
            deploy_all=1
          elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "Poprzedni commit niedostępny — wdrażam wszystkie funkcje Edge."
            deploy_all=1
          fi
          names=()
          if [ "$deploy_all" = 1 ]; then
            for d in supabase/functions/*/index.ts; do
              name="$(basename "$(dirname "$d")")"
              [ "$name" = "_shared" ] && continue
              names+=("$name")
            done
          else
            mapfile -t files < <(git diff --name-only "$before" "$GITHUB_SHA" -- supabase/functions)
            shared=0
            declare -A seen=()
            for f in "${files[@]}"; do
              [ -z "$f" ] && continue
              rest="${f#supabase/functions/}"
              name="${rest%%/*}"
              if [ "$name" = "_shared" ]; then
                shared=1
                continue
              fi
              if [ -f "supabase/functions/${name}/index.ts" ] && [ -z "${seen[$name]:-}" ]; then
                seen[$name]=1
                names+=("$name")
              fi
            done
            if [ "$shared" = 1 ]; then
              names=()
              for d in supabase/functions/*/index.ts; do
                name="$(basename "$(dirname "$d")")"
                [ "$name" = "_shared" ] && continue
                names+=("$name")
              done
            fi
          fi
          if [ "${#names[@]}" -eq 0 ]; then
            echo "Funkcje Edge bez zmian (baza ${before:-brak})."
            exit 0
          fi
          echo "Edge: wdrażam ${#names[@]} funkcji (baza ${before:-brak}): ${names[*]}"
          for name in "${names[@]}"; do
            echo "Wdrażam funkcję: ${name}"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api --yes
          done

      - name: Produkcja Vercel
        if: steps.keys.outputs.skip != 'true'
        run: |
          set -euo pipefail
          set +x
          if [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Brak zmiennych VERCEL_ORG_ID albo VERCEL_PROJECT_ID."
            exit 1
          fi
          npx --yes vercel@64.5.0 deploy --prod --yes
