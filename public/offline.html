<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Watch Tower — brak połączenia</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: system-ui, Segoe UI, sans-serif; background: #0b1220; color: #e8eef5;
        padding: 24px; text-align: center;
      }
      h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 8px; letter-spacing: .02em; }
      p { margin: 0; opacity: .78; font-size: .95rem; max-width: 28rem; line-height: 1.45; }
      button {
        margin-top: 18px; min-height: 44px; min-width: 44px; padding: 10px 18px;
        font: inherit; font-weight: 600; border: 1px solid #e8eef5; background: #e8eef5; color: #0b1220;
        border-radius: 2px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brak połączenia</h1>
      <p>Watch Tower nie może połączyć się z siecią. Sprawdź internet i odśwież stronę.</p>
      <button type="button" onclick="location.reload()">Odśwież</button>
    </main>
  </body>
</html>
