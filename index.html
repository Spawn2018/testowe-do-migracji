<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/brand/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="application-name" content="Watch Tower" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <title>Watch Tower — Stegra Boden</title>
    <link rel="stylesheet" href="/fonts/barlow.css" />
    <style>
      /* #274: .wt-boot — ten sam ekran, gdy po zalogowaniu albo w linku kierowcy czekamy na kawałek aplikacji */
      #wt-boot,.wt-boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg,#0b1220);z-index:9999}
      #wt-boot img,.wt-boot img{width:min(280px,70vw);max-width:360px;height:auto}
      html[data-theme="light"] #wt-boot,html[data-theme="light"] .wt-boot{background:#f4f6fa}
      html[data-theme="light"] #wt-boot img[data-dark],html[data-theme="light"] .wt-boot img[data-dark]{display:none}
      html:not([data-theme="light"]) #wt-boot img[data-light],html:not([data-theme="light"]) .wt-boot img[data-light]{display:none}
    </style>
  </head>
  <body>
    <!-- #274: logo WebP 480 px (~40 kB) zamiast PNG 800 px (~260 kB) — największy element ekranu na telefonie -->
    <div id="wt-boot" aria-hidden="true">
      <img data-light src="/brand/watchtower-logo-full.webp" alt="Watch Tower" width="360" height="120" />
      <img data-dark src="/brand/watchtower-logo-full-dark.webp" alt="Watch Tower" width="360" height="120" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
